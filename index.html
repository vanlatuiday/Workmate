<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <style>
      html { background-color: #05155E; color-scheme: dark; }
      html[data-initial-surface="light"] { background-color: #F5F8FE; color-scheme: light; }
    </style>
    <script>
      // Set the canvas color before CSS or the React bundle is available.
      (() => {
        const path = location.pathname.replace(/\/+$/, '') || '/'
        const dark = path === '/' || /^\/(dang-nhap|dang-ky|quen-mat-khau|tim-viec|tuyen-dung)(\/|$)/.test(path)
        document.documentElement.dataset.initialSurface = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="/workmate-tab-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Workmate – Nền tảng kết nối việc làm linh hoạt" />
    <title>Workmate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
